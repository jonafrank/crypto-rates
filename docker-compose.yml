services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: crypto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d crypto"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/crypto
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FINNHUB_SYMBOLS: BINANCE:ETHUSDT,BINANCE:ETHUSDC,BINANCE:ETHBTC
      CORS_ORIGIN: http://localhost:3000
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  pgdata: {}
